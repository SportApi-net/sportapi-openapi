  /v1/topchampionships/{type}/{lang}:
    get:
      tags:
        - Top selections
      summary: Popular championships
      description: |-
        Returns up to 12 of the most popular championships for Live or Prematch, without matches. Get a championship's matches with `events` using its `sport_id` and `tournament_id` and the same line type. Esports are not included; with a key limited to some sports, the list is built within them. Any other `type` value returns an empty list.

        **Recommended request frequency:** Live — no more than once every 60 seconds; Prematch (`line`) — no more than once every 300 seconds. See [Data Update Guidelines](https://sportapi.net/docs/sport-line/getting-started/update-guidelines.html).
      operationId: getTopChampionships
      externalDocs:
        description: topchampionships — Top Championships
        url: https://sportapi.net/docs/sport-line/api-reference/optional-methods/topchampionships.html
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Championships in order of popularity. May be empty.
          headers:
            X-Key-Expires:
              $ref: '#/components/headers/X-Key-Expires'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopChampionshipsResponse'
              examples:
                line:
                  summary: Prematch, key with basketball and baseball
                  description: Example from the documentation.
                  value:
                    status: 1
                    page: /v1/topchampionships
                    body:
                      - position: 1
                        tournament_id: 166775
                        tournament_name: USA. MLB
                        sport_id: 5
                        sport_name: Baseball
                        country_id: 153
                        country_name: United States
                        counter: 4
                      - position: 2
                        tournament_id: 13589
                        tournament_name: NBA
                        sport_id: 3
                        sport_name: Basketball
                        country_id: 153
                        country_name: United States
                        counter: 41
        default:
          $ref: '#/components/responses/ApiError'
  /v1/account:
    get:
      tags:
        - Account
      summary: The client's keys and access
      description: 'Using **any** of the client''s keys, returns data for **all** of them: expiration
        date, days left, available sports and languages, access restrictions, last use and requests for
        the last 7 days. The key''s language list is convenient for a language switcher. Also returns
        `your_ip` — the address this request came from. There are no parameters and no language in the
        path.'
      operationId: getAccount
      externalDocs:
        description: account — Client Keys and Access
        url: https://sportapi.net/docs/sport-line/api-reference/optional-methods/account.html
      parameters: []
      responses:
        '200':
          description: Client and key data.
          headers:
            X-Key-Expires:
              $ref: '#/components/headers/X-Key-Expires'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              examples:
