components:
  securitySchemes:
    PackageKey:
      type: apiKey
      in: header
      name: Package
      description: Personal API key issued by the SportAPI manager. Send it in the `Package` header with
        every request; never put it in the URL. For public websites, call the API from your backend so
        visitors cannot see the key. See [Authentication and Access](https://sportapi.net/docs/sport-line/getting-started/authentication-and-access.html).
  parameters:
    Type:
      name: type
      in: path
      required: true
      description: 'Sports line type: `live` — matches in progress, `line` — upcoming Prematch matches.'
      schema:
        $ref: '#/components/schemas/LineType'
      example: live
    Lang:
      name: lang
      in: path
      required: true
      description: Language of names. Use the SportAPI code exactly as listed — some codes differ from
        ISO (for example `ua`, `cn`, `br`, `al`). The language must also be included in the key's subscription.
        See [Languages and Language Codes](https://sportapi.net/docs/sport-line/reference/languages.html).
      schema:
        $ref: '#/components/schemas/LanguageCode'
      example: en
    SportId:
      name: sportId
      in: path
      required: true
      description: Sport ID taken from a current `menu` or `sports` response for the same line type. See
        [Sports and `sport_id` Values](https://sportapi.net/docs/sport-line/reference/sports.html).
      schema:
        type: integer
        format: int64
      example: 1
    CountryId:
      name: countryId
      in: path
      required: true
      description: Country ID taken from a current `menu` or `countries` response.
      schema:
        type: integer
        format: int64
      example: 4
    TournamentId:
      name: tournamentId
      in: path
      required: true
      description: Tournament ID taken from a current `menu` or `tournaments` response. Pass `0` to get
        matches from all available tournaments of the sport.
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 0
    EventsFormat:
      name: format
      in: path
      required: true
      description: Response format. `events` supports only `sub`, which groups matches by tournament.
      schema:
        type: string
        enum:
          - sub
      example: sub
    Count:
      name: count
      in: path
      required: true
      description: 'Legacy segment kept for URL compatibility. Always pass `50`: the value does not affect
        the response and must not be used for pagination.'
      schema:
        type: integer
      example: 50
    GameId:
      name: gameId
      in: path
      required: true
      description: Match or sub-match ID (`game_id`) from `events` or `sub_games`, requested with the
        same line type it was obtained from.
      schema:
        type: integer
        format: int64
      example: 746146992
    Cybersport:
      name: cybersport
      in: query
      required: false
      description: '`true` switches the method to esports data.'
      schema:
        type: boolean
        default: false
    Odds:
      name: odds
      in: query
      required: false
      description: '`false` returns matches without `game_oc_list`; all other fields are the same and
        `game_oc_counter` is kept. The response is several times smaller.'
      schema:
        type: boolean
        default: true
    Full:
      name: full
      in: query
      required: false
      description: '`true` returns extended match objects (teams, country, tournament and a **short**
        odds list) instead of short summaries. It does not return the full odds list — use `event` for
        that.'
      schema:
        type: boolean
        default: false
    OddsWithFull:
      name: odds
      in: query
      required: false
      description: 'Only matters together with `full=true`: `full=true&odds=false` returns the extended
        match objects without `game_oc_list`.'
      schema:
        type: boolean
        default: true
  headers:
    X-Key-Expires:
      description: Expiration date of the key sent in the request (ISO 8601, UTC). Present in every successful
        response.
      schema:
        type: string
        format: date-time
      example: '2026-11-03T14:34:23.479Z'
  responses:
    ApiError:
      description: Access or parameter error (`error_code` + `error_message`). The documentation does
        not define the HTTP status codes of error responses, so always check the parsed JSON for `error_code`.
        See [Error Handling](https://sportapi.net/docs/sport-line/getting-started/error-handling.html).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingPackage:
              summary: Missing Package header
              description: The key was not sent in the `Package` header.
              value:
                error_code: 100
                error_message: Missing Package header
            invalidPackage:
              summary: Invalid Package
              description: The key was not found.
              value:
                error_code: 100
                error_message: Invalid Package
            expired:
              summary: Package has expired
              description: The key expired or access was disabled.
              value:
                error_code: 100
                error_message: Package has expired
            blocked:
              summary: Package is blocked
              description: The key is temporarily paused.
              value:
                error_code: 100
                error_message: Package is blocked
            notActiveYet:
              summary: Package is not active yet
              description: The key's access period has not started.
              value:
                error_code: 100
                error_message: Package is not active yet
            ipNotAllowed:
              summary: Request from a non-allowed IP
              description: The key is restricted to other IP addresses or websites (`Access from site
                … is not allowed for this Package` for browser requests).
              value:
                error_code: 100
                error_message: Access from IP 203.0.113.50 is not allowed for this Package
            accessDenied:
              summary: Access denied
              description: The key does not give access to the requested data or sport.
              value:
                error_code: 100
                error_message: Access denied
            languageNotInPackage:
              summary: Language not in subscription
              description: The language exists but is not included in the key's subscription.
              value:
                error_code: 100
                error_message: The language is not available in your package.
            invalidLanguage:
              summary: Invalid language
              description: The language code is not supported.
              value:
                error_code: 100
                error_message: Invalid language
            wrongType:
              summary: Wrong line type
              description: Returned explicitly by `search`; other methods may return an empty response
                for an invalid line type.
              value:
                error_code: 90
                error_message: Wrong data type (accept only live or line)
  schemas:
    LineType:
      type: string
      description: 'Sports line type: `live` — matches in progress, `line` — upcoming Prematch matches.'
      enum:
        - live
        - line
    LanguageCode:
      type: string
      description: SportAPI language code (69 languages). Some codes are internal SportAPI codes and do
        not match ISO codes. See [Languages and Language Codes](https://sportapi.net/docs/sport-line/reference/languages.html).
      enum:
        - al
        - aa
        - ar
        - hy
        - az
        - bn
