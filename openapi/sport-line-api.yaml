  /v1/events/{sportId}/{tournamentId}/{format}/{count}/{type}/{lang}:
    get:
      tags:
        - Matches
      summary: Match list for a sport or tournament
      description: |-
        Returns matches of the selected sport, grouped by tournament: main match data, teams, start time, Live score and period, a **short** list of the main markets and odds, Live statistics, video and tracker IDs. Use `event` to get the complete market list of one match.

        | Request | Result |
        |---|---|
        | `.../{sportId}/0/sub/50/line/{lang}` | "Top": 50 matches (next 24 hours first, most popular first) |
        | `.../{sportId}/0/sub/50/line/{lang}?match=all` | The full Prematch line of the sport |
        | `.../{sportId}/{tournamentId}/sub/50/line/{lang}` | All matches of the tournament |
        | `.../{sportId}/0/sub/50/live/{lang}` | All Live matches of the sport |

        The "Top" rule does not apply to Live or to esports (`cybersport=true`). In this list `sub_games` and `event_plan` are always `[]`.

        **Recommended request frequency:** Live — no more than once every 7 seconds; Prematch (`line`) — no more than once every 30 seconds. See [Data Update Guidelines](https://sportapi.net/docs/sport-line/getting-started/update-guidelines.html).
      operationId: getEvents
      externalDocs:
        description: events — Match List
        url: https://sportapi.net/docs/sport-line/api-reference/events.html
      parameters:
        - $ref: '#/components/parameters/SportId'
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/EventsFormat'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Cybersport'
        - name: match
          in: query
          required: false
          description: '`all` — the full line of the sport instead of the "Top" selection. Only for `type=line`
            with `tournamentId=0`.'
          schema:
            type: string
            enum:
              - all
        - $ref: '#/components/parameters/Odds'
      responses:
        '200':
          description: Tournaments with nested matches. An empty `body` means no matches for the conditions.
          headers:
            X-Key-Expires:
              $ref: '#/components/headers/X-Key-Expires'
          content:
