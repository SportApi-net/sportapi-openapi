  /v1/events/{sportId}/{tournamentId}/{format}/{count}/line/{hours}/{days}/{lang}:
    get:
      tags:
        - Matches
      summary: Match calendar (Prematch by period)
      description: |-
        Returns Prematch matches that start within the selected period: the next 2, 4, 6 or 12 hours, today, or a specific day up to 5 days ahead. It is the `events` method with two extra path segments and the same response structure.

        | `hours` | `days` | Matches returned |
        |---|---|---|
        | `2`, `4`, `6`, `12` | any | From now until now + N hours (`days` is ignored) |
        | `0` | `0` | Today: from now until the end of the day |
        | `0` | `1`…`5` | That calendar day only, 00:00–24:00 (`1` — tomorrow) |
        | `0` | greater than `5` | Empty list |

        Days follow Kyiv time (`Europe/Kyiv`). Other `hours` values (for example `3`) do not cause an error — the period is then defined by `days`. Matches that have already started are not included. The "Top" rule does not apply: all matches of the period are returned. Esports are not supported.

        **Recommended request frequency:** no more than once every 60 seconds. See [Data Update Guidelines](https://sportapi.net/docs/sport-line/getting-started/update-guidelines.html).
      operationId: getEventsByPeriod
      externalDocs:
        description: Match Calendar — events by Period
        url: https://sportapi.net/docs/sport-line/api-reference/events-by-period.html
      parameters:
        - $ref: '#/components/parameters/SportId'
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/EventsFormat'
        - $ref: '#/components/parameters/Count'
        - name: hours
          in: path
          required: true
          description: 'Period in hours from now: `2`, `4`, `6` or `12`. `0` — the period is set by `days`.'
          schema:
            type: integer
            minimum: 0
          example: 2
        - name: days
          in: path
          required: true
          description: 'Day: `0` — today until the end of the day, `1` — tomorrow, … `5`.'
          schema:
            type: integer
            minimum: 0
          example: 0
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Odds'
      responses:
        '200':
          description: Tournaments with nested matches of the period. An empty `body` means no matches
            in the period.
          headers:
            X-Key-Expires:
              $ref: '#/components/headers/X-Key-Expires'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
              examples:
                calendar:
                  summary: Abridged example from the documentation
                  description: A match in the real response has the same fields as in `events`.
                  value:
                    status: 1
                    page: /v1/events
                    body:
                      - tournament_id: 1706694
                        tournament_name: UEFA Nations League
                        events_list:
                          - game_id: 758182302
                            game_start: 1791295200
                            opp_1_name: Kazakhstan
                            opp_2_name: Faroe Islands
                            game_oc_counter: 1261
                empty:
                  summary: No matches in the period
                  value:
                    status: 1
                    page: /v1/events
                    body: []
        default:
          $ref: '#/components/responses/ApiError'
  /v1/event/{gameId}/group/{type}/{lang}:
    get:
      tags:
        - Matches
      summary: Specific match with the complete market list
      description: |-
        Returns detailed data for one match or sub-match: the complete available market list in the `group` format (markets → columns → selections, already sorted), Live statistics, the `sub_games` list of sub-matches, `event_plan` for group matches, video and tracker IDs.

        To get the odds of a sub-match (corners, a half, cards…), call this method again with the sub-match `game_id` from `sub_games`. Request an ID with the same line type it came from.

        If the match is no longer available, `body` contains only `message` (`Game not found` or `Game id finished`) — check for it before parsing match fields.

        **Recommended request frequency:** Live — no more than once every 5 seconds; Prematch (`line`) — no more than once every 30 seconds. See [Data Update Guidelines](https://sportapi.net/docs/sport-line/getting-started/update-guidelines.html).
      operationId: getEvent
      externalDocs:
        description: event — Specific Match
        url: https://sportapi.net/docs/sport-line/api-reference/event.html
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Odds'
