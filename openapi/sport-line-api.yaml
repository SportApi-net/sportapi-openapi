  - name: Matches
    description: Match lists, the match calendar, a specific match with all markets, and search.
    externalDocs:
      description: Match Data Model
      url: https://sportapi.net/docs/sport-line/data-models/match.html
  - name: Top selections
    description: Ready-made selections of popular matches and championships.
    externalDocs:
      description: Sport Line API Methods
      url: https://sportapi.net/docs/sport-line/api-reference/overview.html
  - name: Account
    description: The client's keys, access period and usage.
    externalDocs:
      description: Authentication and Access
      url: https://sportapi.net/docs/sport-line/getting-started/authentication-and-access.html
paths:
  /v1/menu/{type}/{lang}:
    get:
      tags:
        - Navigation
      summary: Sports line menu (sport → country → tournament)
      description: |-
        Returns the hierarchy of the available sports line — sports, their countries and tournaments — with the number of available matches at each level. Use it to build the site menu and to get the `sportId` and `tournamentId` for `events`. It contains no matches or odds.

        Only sections that currently have matches for the selected line type are returned, so do not store the IDs as a permanent list. Tournament names may occasionally be empty strings.

        **Recommended request frequency:** Live — no more than once every 20 seconds; Prematch (`line`) — no more than once every 60 seconds. See [Data Update Guidelines](https://sportapi.net/docs/sport-line/getting-started/update-guidelines.html).
      operationId: getMenu
      externalDocs:
        description: menu — Sports Line Menu
        url: https://sportapi.net/docs/sport-line/api-reference/menu.html
