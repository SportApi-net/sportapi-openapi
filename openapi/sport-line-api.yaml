        - es
        - mx
        - sw
        - tl
        - tj
        - th
        - tr
        - ua
        - ur
        - uz
        - vi
        - zu
    ResponseStatus:
      type: integer
      description: 'Response generation status. Confirmed successful responses return `1`. `status: 1`
        does not guarantee that `body` contains data — always inspect `body`.'
      example: 1
    ResponsePage:
      type: string
      description: 'Name of the method that generated the response, for diagnostics only. Do not use it
        to build URLs. Note: `topmatches` currently returns `/v1/topmathes`.'
      example: /v1/menu
    ErrorResponse:
      type: object
      description: Access or parameter error. Returned without `status`, `page` or `body`. Use `error_code`
        and `error_message` for handling. See [Error Handling](https://sportapi.net/docs/sport-line/getting-started/error-handling.html).
      required:
        - error_code
        - error_message
      properties:
        error_code:
          type: integer
          description: Numeric error category code, for example `100` (access) or `90` (wrong line type).
          example: 100
        error_message:
          type: string
          description: Text describing the cause.
          example: Invalid Package
    Sport:
      type: object
      description: 'A sport. Returned by `sports`. Standard SportAPI icons are available by ID: `https://cdn.sportapi.net/sports/v1/color/{sportId}.webp`,
        `https://cdn.sportapi.net/flags/v1/color/{countryId}.webp`, `https://cdn.sportapi.net/tournaments/v1/color/{tournamentId}.webp`.
        See [SportAPI Icons and Media Assets](https://sportapi.net/docs/sport-line/reference/media-assets.html).'
      required:
        - id
        - name
        - counter
      properties:
        id:
          type: integer
          format: int64
          description: Sport ID. Used as `sportId` in other method URLs.
          example: 1
        name:
          type: string
          description: Sport name in the requested language.
          example: Football
        counter:
          type: integer
          minimum: 0
          description: Number of available matches for this sport.
    Country:
      type: object
      description: A country for the selected sport. Returned by `countries`.
      required:
        - id
        - name
        - sport_id
        - counter
      properties:
        id:
          type: integer
          format: int64
          description: Country ID. Used as `countryId` in other method URLs.
          example: 4
        name:
          type: string
          description: Country name in the requested language.
          example: Australia
        sport_id:
          type: integer
          format: int64
          description: ID of the sport for which the country was returned. Note the JSON name `sport_id`.
        counter:
          type: integer
          minimum: 0
          description: Number of available matches for the selected sport in this country.
    Tournament:
      type: object
      description: 'A tournament in navigation methods (`tournaments` and inside `menu`). Note the exact
        JSON names: `sport_id`, but `countryId` with an uppercase `I`.'
      required:
        - id
        - name
        - counter
        - sport_id
        - countryId
      properties:
        id:
          type: integer
          format: int64
          description: Tournament ID. Used as `tournamentId` in other method URLs.
          example: 149213
        name:
          type: string
          description: Tournament name in the requested language. The API may occasionally return an empty
            string — do not invent a name from other fields.
        counter:
          type: integer
          minimum: 0
          description: Number of available matches in this tournament.
        sport_id:
          type: integer
          format: int64
          description: ID of the tournament's sport.
        countryId:
          type: integer
          format: int64
          description: ID of the tournament's country.
    MenuCountry:
      type: object
      description: A country inside a `menu` sport (`body[].sub[]`).
      required:
        - id
        - name
        - counter
        - sport_id
      properties:
        id:
          type: integer
          format: int64
          description: Country ID. Used as `countryId` in other method URLs.
        name:
          type: string
          description: Country name in the requested language.
        counter:
          type: integer
          minimum: 0
          description: Number of available matches across all tournaments of this country.
        sport_id:
          type: integer
          format: int64
          description: ID of the sport associated with the country.
        sub:
          type: array
          description: Available tournaments in this country.
          items:
            $ref: '#/components/schemas/Tournament'
    MenuSport:
      type: object
      description: 'A sport at the top level of `menu`, with nested countries and tournaments. Standard
        SportAPI icons are available by ID: `https://cdn.sportapi.net/sports/v1/color/{sportId}.webp`,
        `https://cdn.sportapi.net/flags/v1/color/{countryId}.webp`, `https://cdn.sportapi.net/tournaments/v1/color/{tournamentId}.webp`.
        See [SportAPI Icons and Media Assets](https://sportapi.net/docs/sport-line/reference/media-assets.html).'
      required:
        - id
        - name
        - counter
      properties:
        id:
          type: integer
          format: int64
          description: Sport ID. Used as `sportId` in other method URLs.
        name:
          type: string
          description: Sport name in the requested language.
        counter:
          type: integer
          minimum: 0
          description: Total number of available matches for this sport.
        sub:
          type: array
          description: Countries with available matches for this sport.
          items:
            $ref: '#/components/schemas/MenuCountry'
    OcSize:
      description: Handicap, total or another selection parameter; usually `0` for selections without
        a separate value. Both JSON types occur in real responses (`0`, `"2.5"`, `"-0.25"`), so support
        both.
      oneOf:
        - type: number
        - type: string
      example: '2.5'
    Outcome:
      type: object
      description: One betting selection (outcome) with its current odds. See [Odds and Betting Markets](https://sportapi.net/docs/sport-line/data-models/odds.html).
      required:
        - oc_name
        - oc_rate
        - oc_pointer
      properties:
        oc_group_name:
          type: string
          description: Betting market name in the requested language. Not a technical ID.
          example: 1X2
        oc_name:
          type: string
          description: Ready-to-display selection name in the requested language.
          example: W1
        oc_rate:
          type: number
          description: Current decimal odds. Not an identifier.
          example: 1.525
        oc_size:
          $ref: '#/components/schemas/OcSize'
        oc_pointer:
          type: string
          description: 'Primary composite code of the selection. Treat it as an opaque string: store it
            in full, compare the complete value and pass it unchanged to the bet placement system ([bet
            pointer](https://sportapi.net/docs/coupon/bet-placement/bet-pointer.html)). For player-specific
            selections also store `op_id`.'
          example: 730321837|1|1|0
        oc_block:
          type: boolean
          description: '`true` — the selection is blocked and unavailable; `false` — available. Re-check
            on every update.'
        op_id:
          type: integer
          format: int64
          nullable: true
          description: Player or participant ID for a player-specific selection; `null` otherwise.
    ShortMarket:
      type: object
      description: A betting market in the short odds list of `events`, `topmatches?full=true` and `toplist?full=true`.
        `oc_list` is a flat array of selections. The set of markets depends on the sport — do not build
        the interface only around `1X2`. See [Odds and Betting Markets](https://sportapi.net/docs/sport-line/data-models/odds.html).
      properties:
        group_id:
          type: integer
          format: int64
          description: Technical betting market ID.
          example: 1
        group_name:
          type: string
          description: Market name in the requested language.
          example: 1X2
        columns:
          type: integer
          description: Recommended number of display columns.
          example: 3
        oc_list:
          type: array
          description: Selections and odds in the market.
          items:
            $ref: '#/components/schemas/Outcome'
    GroupedMarket:
      type: object
      description: A betting market in the `event` (`group` format) response. `oc_list` is an array of
        columns; each column is an array of selections, already sorted by the API. Preserve the order
        of markets, columns and selections. See [Odds and Betting Markets](https://sportapi.net/docs/sport-line/data-models/odds.html).
      properties:
        group_id:
          type: integer
          format: int64
          description: Technical betting market ID.
          example: 17
        group_name:
          type: string
          description: Market name in the requested language.
          example: Total
        columns:
          type: integer
          description: Recommended number of display columns. It does not have to equal the number of
            nested arrays.
          example: 2
        oc_list:
          type: array
          description: Selection columns of the market.
          items:
            type: array
            items:
              $ref: '#/components/schemas/Outcome'
    StatEntry:
      type: object
      description: One Live statistic. Values are strings even when numeric; a missing statistic is unknown,
        not zero. See [Live Statistics](https://sportapi.net/docs/sport-line/data-models/live-statistics.html).
      properties:
        id:
          type: integer
          format: int64
          description: Technical statistic ID — use it to match statistics programmatically.
          example: 45
        name:
          type: string
          description: Statistic name in the requested language.
          example: Attacks
        opp1:
          type: string
          description: Value for the first side (`opp_1_name`).
          example: '61'
        opp2:
          type: string
          description: Value for the second side (`opp_2_name`).
          example: '54'
    SubGame:
      type: object
      description: 'Link to a sub-match (half, corners, cards, player statistics and so on). It contains
        no odds: request `event` with its `game_id`. See [Sub-events](https://sportapi.net/docs/sport-line/data-models/sub-events.html).'
      properties:
        game_id:
          type: integer
          format: int64
          nullable: true
          description: Sub-match ID for a separate `event` request.
        game_num:
          type: integer
          format: int64
          nullable: true
          deprecated: true
          description: Legacy service field, scheduled for removal.
        game_name:
          type: string
          nullable: true
          description: Sub-match name in the requested language.
    EventPlanEntry:
      type: object
      description: 'One pair of teams inside a group match (`event_plan`). Not a link to a sub-match:
        it has no `game_id`.'
      properties:
        opp_1_name:
          type: string
          description: Team on the home side.
        opp_2_name:
          type: string
          description: Team on the away side.
        opp_1_id:
          type: integer
          format: int64
          nullable: true
          description: Home-side team ID.
        opp_2_id:
          type: integer
          format: int64
          nullable: true
          description: Away-side team ID.
        opp_1_country_id:
          type: integer
          format: int64
          nullable: true
          description: Country ID of the home-side team.
        opp_2_country_id:
          type: integer
          format: int64
          nullable: true
          description: Country ID of the away-side team.
        opp_1_icon:
          type: string
          description: Home-side team icon file name.
        opp_2_icon:
          type: string
          description: Away-side team icon file name.
        opp_1_date:
          type: integer
          format: int64
          nullable: true
          description: Date and time associated with the home-side team, Unix timestamp.
        opp_2_date:
          type: integer
          format: int64
          nullable: true
          description: Date and time associated with the away-side team, Unix timestamp.
        game_start:
          type: integer
          format: int64
          nullable: true
          description: Start time of this pair's meeting, Unix timestamp.
    MatchCore:
      type: object
      description: Fields shared by match objects in `events`, `event` and the extended (`full=true`)
        `topmatches`/`toplist` responses. In Prematch many Live fields hold default values (`0`, empty
        string, empty array or `null`). See [Match](https://sportapi.net/docs/sport-line/data-models/match.html)
        and [Field Reference](https://sportapi.net/docs/sport-line/data-models/field-reference.html).
      required:
        - game_id
      properties:
        game_id:
          type: integer
          format: int64
          description: Match ID, used to request `event`. A new `game_id` is generated when a match moves
            from Prematch to Live — do not link Prematch and Live by this field.
          example: 746146992
        game_mid:
          type: integer
          format: int64
          nullable: true
          description: Main match ID. Equals `game_id` for a main match; points to the main match for
            a sub-match.
        sgame_id:
          type: string
          description: Reserved test field. Not currently used by the API.
        stat_id:
          type: string
          description: Reserved test field. Not currently used by the API.
        game_num:
          type: integer
          format: int64
          deprecated: true
          description: Legacy unused field, scheduled for removal from the API.
        game_start:
          type: integer
          format: int64
          description: Match start time, Unix timestamp in seconds.
          example: 1787338800
        sport_id:
          type: integer
          format: int64
          description: Sport ID.
        sport_name:
          type: string
          description: Sport name in the requested language.
        country_id:
          type: integer
          format: int64
          description: Country ID.
        country_name:
          type: string
          description: Country name in the requested language.
        tournament_id:
          type: integer
          format: int64
          description: Tournament ID.
        tournament_name:
          type: string
          description: Tournament name in the requested language.
        game_dop_name:
          type: string
          description: Sub-match type name, such as `Corners`; empty for a main match.
        game_desk:
          type: string
          description: Game segment type, such as `Half`, `Set` or `Quarter`.
        opp_1_name:
          type: string
          description: First team or participant.
        opp_2_name:
          type: string
          description: Second team or participant.
        opp_1_id:
          type: integer
          format: int64
          description: Primary ID of the first team or participant.
        opp_2_id:
          type: integer
          format: int64
          description: Primary ID of the second team or participant.
        opp_1_ids:
          type: array
          description: Participant IDs of the first side when it has several players or teams (for example
            tennis doubles).
          items:
            type: integer
            format: int64
        opp_2_ids:
          type: array
          description: Participant IDs of the second side when it has several players or teams.
          items:
            type: integer
            format: int64
        opp_1_icon:
          type: string
          description: Icon file name, for example `8bd073a686a067e6732d8d1688a517c0.png`. Remove the
            extension and insert the remaining name into `https://cdn.sportapi.net/opp/v1/color/{iconName}.webp`.
        opp_2_icon:
          type: string
          description: Icon file name, for example `8bd073a686a067e6732d8d1688a517c0.png`. Remove the
            extension and insert the remaining name into `https://cdn.sportapi.net/opp/v1/color/{iconName}.webp`.
        game_oc_counter:
          type: integer
          minimum: 0
          description: Total number of available selections for the match. Kept when `odds=false`.
        timer:
          type: integer
          description: Match timer in seconds (divide by 60 for minutes). Usually `0` in Prematch.
        score_full:
          type: string
          description: Current overall score, for example `"1:0"`.
        score_period:
          type: string
          description: Score by period or for the current segment. May be an empty string.
        score_extra:
          type: string
          description: Tennis game score, such as `0:15`, or an empty string.
        period_name:
          type: string
          description: Current period name. Usually an empty string in Prematch.
        extra_time:
          type: string
          description: Added minutes, for example `+10`, or an empty string.
        finale:
          type: boolean
          nullable: true
          description: Indicates that the match has ended. Not available for every match.
        pitch:
          type: string
          description: ID of the serving participant in applicable sports, or an empty string.
        stat_list:
          type: array
          description: Main Live statistics. Populated only in Live `events` and `event`; may be empty.
          items:
            $ref: '#/components/schemas/StatEntry'
        stat_list_extra:
          type: array
          description: Reserved test field. Not currently used.
          items: {}
        sub_games:
          type: array
          description: Sub-match links. Populated only in `event`; returned as `[]` elsewhere.
          items:
            $ref: '#/components/schemas/SubGame'
        event_plan:
          type: array
          description: Team pairs of a group match. Populated only in `event`; returned as `[]` elsewhere.
          items:
            $ref: '#/components/schemas/EventPlanEntry'
        game_plan:
          description: Reserved test field (any JSON value or `null`). Not currently used.
        va:
          type: integer
          nullable: true
          description: '`1` — video is available; `null` — not available. `0` is not used. See [Video
            Streaming](https://sportapi.net/docs/sport-line/additional-services/video-streaming.html).'
        vi:
          type: string
          nullable: true
          description: Live video stream ID (not a URL), or `null`.
        zp:
          type: integer
          format: int64
          nullable: true
          description: Live 3D Tracker ID, passed to the tracker as `gameid`; `null` — tracker unavailable.
            See [Live 3D Tracker](https://sportapi.net/docs/sport-line/additional-services/live-3d-tracker.html).
    MatchListItem:
      description: Match object in `events` and in extended (`full=true`) `topmatches`/`toplist` responses,
        with a short list of the main markets.
      allOf:
        - $ref: '#/components/schemas/MatchCore'
        - type: object
          properties:
            game_oc_list:
              type: array
              description: Short list of the main markets and best odds. Absent when `odds=false`.
              items:
                $ref: '#/components/schemas/ShortMarket'
    MatchDetail:
      description: Detailed match or sub-match object returned by `event`, with the complete market list.
      allOf:
        - $ref: '#/components/schemas/MatchCore'
        - type: object
          properties:
            game_oc_list:
              type: array
              description: Complete available market list in the `group` format. Absent when `odds=false`.
              items:
                $ref: '#/components/schemas/GroupedMarket'
    EventMessage:
      type: object
      description: State of a specific match returned inside a successful envelope instead of a match
        object. `Game id finished` does not tell why the match disappeared (moved to Live with a new `game_id`,
        cancelled, or removed) — stop requesting the old `game_id` and refresh `events`.
      required:
        - message
      properties:
        message:
          type: string
          example: Game id finished
    MatchSummary:
      type: object
      description: Short match summary without odds, returned by `search` and by `topmatches`/`toplist`
        without `full=true`. `search` items include `tournament_id`, `country_id` and `country_name`;
        `topmatches`/`toplist` summaries include `va`, `vi` and `zp` instead. Request `event` with `game_id`
        for full data.
      required:
        - game_id
      properties:
        sgame_id:
          type: string
          description: Reserved test field. Not currently used by the API.
        stat_id:
          type: string
          description: Reserved test field. Not currently used by the API.
        game_id:
          type: integer
          format: int64
          description: Match ID for requesting `event`.
        game_mid:
          type: integer
          format: int64
          nullable: true
          description: Main match ID.
        game_start:
          type: integer
          format: int64
          description: Start time, Unix timestamp in seconds.
        tournament_id:
          type: integer
          format: int64
          description: Tournament ID (`search` only).
        tournament_name:
          type: string
          description: Tournament name in the requested language.
        opp_1_name:
          type: string
          description: First team or participant.
        opp_2_name:
          type: string
          description: Second team or participant.
        opp_1_icon:
          type: string
          description: Icon file name, for example `8bd073a686a067e6732d8d1688a517c0.png`. Remove the
            extension and insert the remaining name into `https://cdn.sportapi.net/opp/v1/color/{iconName}.webp`.
        opp_2_icon:
          type: string
          description: Icon file name, for example `8bd073a686a067e6732d8d1688a517c0.png`. Remove the
            extension and insert the remaining name into `https://cdn.sportapi.net/opp/v1/color/{iconName}.webp`.
        sport_id:
          type: integer
          format: int64
          description: Sport ID.
        sport_name:
          type: string
          description: Sport name in the requested language.
        score_full:
          type: string
          description: Current score. Prematch usually returns `0:0`.
        period_name:
          type: string
          description: Current Live period. Prematch returns an empty string.
        timer:
          type: integer
          description: Live timer in seconds. Prematch usually returns `0`.
        country_id:
          type: integer
          format: int64
          description: Country ID (`search` only).
        country_name:
          type: string
          description: Country name in the requested language (`search` only).
        va:
          type: integer
          nullable: true
          description: '`1` — video is available; `null` — not available.'
        vi:
          type: string
          nullable: true
          description: Live video stream ID, or `null`.
        zp:
          type: integer
          format: int64
          nullable: true
          description: Live 3D Tracker ID, or `null`.
    EventsTournament:
      type: object
      description: A tournament with its matches in the `events` response.
      properties:
        tournament_id:
          type: integer
          format: int64
          description: Tournament ID.
        tournament_name:
          type: string
          description: Tournament name in the requested language.
        events_list:
          type: array
          description: Matches of this tournament.
          items:
            $ref: '#/components/schemas/MatchListItem'
    TopChampionship:
      type: object
      description: A popular championship returned by `topchampionships` (without matches).
      properties:
        position:
          type: integer
          description: 'Place in the list: `1`, `2`, …'
        tournament_id:
          type: integer
          format: int64
          description: Championship ID. Used as `tournamentId` in `events`.
        tournament_name:
          type: string
          description: Championship name in the requested language.
        sport_id:
          type: integer
          format: int64
          description: Sport ID.
        sport_name:
          type: string
          description: Sport name in the requested language.
        country_id:
          type: integer
          format: int64
          description: Country or region ID.
        country_name:
          type: string
          description: Country or region name in the requested language.
        counter:
          type: integer
          minimum: 0
          description: 'Number of matches: in Prematch — in the whole line; in Live — in progress now.'
    AccountKeyUsage:
      type: object
      description: Successful requests on one day (UTC).
      properties:
        date:
          type: string
          format: date
          example: '2026-10-04'
        requests:
          type: integer
          minimum: 0
          example: 7
    AccountKey:
      type: object
      description: One of the client's keys. Revoked keys are not included.
      properties:
        key:
          type: string
          description: The last 4 characters of the key. The full key is never returned.
          example: …c55f
        current:
          type: boolean
          description: '`true` — the key used for this request.'
        type:
          type: string
          description: '`test` — test key, `prod` — production key.'
          enum:
            - test
            - prod
        status:
          type: string
          description: '`active` — active, `paused` — paused.'
          enum:
            - active
            - paused
        label:
          type: string
          nullable: true
          description: Key label, for example "site 1" or "mirror".
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: Start of the access period (ISO 8601, UTC); `null` — active since issue.
        expires_at:
          type: string
          format: date-time
          description: End of the access period (ISO 8601, UTC).
        days_left:
          type: integer
          minimum: 0
          description: Days left, rounded up; `0` — expired.
        active:
          type: boolean
          description: 'The key works now: status `active`, the period has started and not expired.'
        sports:
          description: '`"all"` — all sports of the line; otherwise a list of sport IDs.'
          oneOf:
            - type: string
              enum:
                - all
            - type: array
              items:
                type: integer
                format: int64
        languages:
          type: array
          description: Languages available with the key in the line — suitable for a language switcher.
          items:
            type: string
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Time of the last request with the key (UTC), updated once a minute; `null` — never
            used.
        access_mode:
          type: string
          description: 'Access restriction: `off` — from anywhere; `monitor` — from anywhere, sources
            are checked without denial; `enforce` — only from allowed IP addresses or websites.'
          enum:
            - 'off'
            - monitor
            - enforce
        allowed_ips:
          type: array
          description: Allowed IP addresses and subnets, for example `198.51.100.0/24`.
          items:
            type: string
        allowed_domains:
          type: array
          description: 'Allowed websites for browser requests: `example.com` or `*.example.com`.'
          items:
            type: string
        usage_7d:
          type: array
          description: Successful requests per day (UTC) for the last 7 days; today is the last element.
          items:
            $ref: '#/components/schemas/AccountKeyUsage'
    Account:
      type: object
      description: 'The client''s access: data for all keys of the client, returned using any of them.'
      properties:
        client:
          type: object
          properties:
            public_id:
              type: string
              description: Client identifier.
            name:
              type: string
              description: Client name.
        your_ip:
          type: string
          description: The IP address this request came from. Send it to the manager to restrict the key
            by IP.
          example: 203.0.113.7
        keys:
          type: array
          items:
            $ref: '#/components/schemas/AccountKey'
    MenuResponse:
      type: object
      description: '`menu` response.'
      required:
        - status
        - page
        - body
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        page:
          $ref: '#/components/schemas/ResponsePage'
        body:
          type: array
          description: Available sports.
          items:
            $ref: '#/components/schemas/MenuSport'
    SportsResponse:
      type: object
      description: '`sports` response.'
      required:
        - status
        - page
        - body
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        page:
          $ref: '#/components/schemas/ResponsePage'
        body:
          type: array
          items:
            $ref: '#/components/schemas/Sport'
    CountriesResponse:
      type: object
      description: '`countries` response.'
      required:
        - status
        - page
        - body
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        page:
          $ref: '#/components/schemas/ResponsePage'
        body:
          type: array
          items:
            $ref: '#/components/schemas/Country'
    TournamentsResponse:
      type: object
      description: '`tournaments` response.'
      required:
        - status
        - page
        - body
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        page:
          $ref: '#/components/schemas/ResponsePage'
        body:
          type: array
          items:
            $ref: '#/components/schemas/Tournament'
    EventsResponse:
      type: object
      description: '`events` response: tournaments with nested match lists. An empty array means no matches
        for the conditions.'
      required:
        - status
        - page
        - body
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        page:
          $ref: '#/components/schemas/ResponsePage'
        body:
          type: array
          items:
            $ref: '#/components/schemas/EventsTournament'
    EventResponse:
      type: object
      description: '`event` response: one match object, or a service message in `body.message`.'
      required:
        - status
        - page
        - body
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        page:
          $ref: '#/components/schemas/ResponsePage'
        body:
          oneOf:
            - $ref: '#/components/schemas/MatchDetail'
            - $ref: '#/components/schemas/EventMessage'
    SearchResponse:
      type: object
      description: '`search` response: a flat list of matching matches. An empty array means nothing was
        found.'
      required:
        - status
        - page
        - body
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        page:
          $ref: '#/components/schemas/ResponsePage'
        body:
          type: array
          items:
            $ref: '#/components/schemas/MatchSummary'
    TopMatchesResponse:
      type: object
      description: '`topmatches` / `toplist` response: a flat match list (up to 10). Short summaries by
        default, extended match objects with `full=true`.'
      required:
        - status
        - page
        - body
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        page:
          $ref: '#/components/schemas/ResponsePage'
        body:
          type: array
          description: Short summaries (`MatchSummary`) by default; extended objects (`MatchListItem`)
            with `full=true`.
          items:
            anyOf:
              - $ref: '#/components/schemas/MatchSummary'
              - $ref: '#/components/schemas/MatchListItem'
    TopChampionshipsResponse:
      type: object
      description: '`topchampionships` response. May be empty.'
      required:
        - status
        - page
        - body
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        page:
          $ref: '#/components/schemas/ResponsePage'
        body:
          type: array
          items:
            $ref: '#/components/schemas/TopChampionship'
    AccountResponse:
      type: object
      description: '`account` response.'
      required:
        - status
        - page
        - body
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        page:
          $ref: '#/components/schemas/ResponsePage'
        body:
          $ref: '#/components/schemas/Account'
