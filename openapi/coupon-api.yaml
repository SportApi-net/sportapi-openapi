components:
  securitySchemes:
    ClientJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Client JWT from `POST /api/partner/login`, sent as `Authorization: Bearer <token>`.
        There is no refresh method: on HTTP 401 sign in again. An administrator JWT cannot be used. See
        [Authentication](https://sportapi.net/docs/coupon/getting-started/authentication.html).'
  responses:
    BadRequest:
      description: Invalid JSON or an incompatible parameter type. Correct the request.
    Unauthorized:
      description: The JWT is missing, malformed, expired or revoked. Sign in again with `POST /api/partner/login`
        and retry a safe request — do not loop if a fresh token is rejected too.
    Forbidden:
      description: The token lacks the client role (for example an administrator JWT) or access is denied.
    ServerError:
      description: Internal or temporary server error. Read methods can be retried; never retry coupon
        placement blindly — first make sure the original request was not processed.
  schemas:
    ResponseEnvelope:
      type: object
      description: Common envelope of the `/api/partner/**` methods. **HTTP 200 does not mean success:**
        business errors are usually returned with HTTP 200 and `code = 0`. Check `code`, then `error_code`.
        See [API Response Format](https://sportapi.net/docs/coupon/reference/response-format.html).
      required:
        - code
      properties:
        code:
          type: integer
          enum:
            - 0
            - 1
          description: 'Operation result: `1` — success, `0` — business error.'
        body:
          description: Operation result or error details. Its type depends on the method (object, array,
            string or `null`).
        error_code:
          type: integer
          format: int64
          nullable: true
          description: Machine-readable business error code; `null` on success. Use it, not `error_message`,
            in program logic.
        error_message:
          type: string
          nullable: true
          description: Error description for diagnostics; `null` on success. May be refined over time.
        date:
          type: integer
          format: int64
          description: Response generation time. Unix timestamp in milliseconds.
          example: 1784970000000
        time_ms:
          type: integer
          description: Server-side processing time in milliseconds.
          example: 5
        path:
          type: string
          description: Path of the method that processed the request.
          example: /api/partner/coupons/get
    BusinessError:
      description: 'Business error: the request was processed but the operation failed. Usually returned
        with HTTP 200. Handle `error_code`; for coupon placement errors `501`–`504`, `body.changes` lists
        the affected bets. See [Error Codes](https://sportapi.net/docs/coupon/reference/error-codes.html).'
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required:
            - error_code
          properties:
            code:
              type: integer
              enum:
                - 0
            error_code:
              type: integer
              description: Business error code.
              example: 471
    HealthResponse:
      description: Health-check response. Returned with `code = 1`.
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required:
            - body
          properties:
            code:
              type: integer
              enum:
                - 1
            body:
              type: string
              example: ok
    LoginRequest:
      type: object
      description: 'Partner credentials issued by the SportAPI manager. Provide exactly one username field:
        `username` (recommended) or its compatibility alias `login`.'
      required:
        - password
      properties:
        username:
          type: string
          description: Partner username.
          example: partner-demo
        login:
          type: string
          description: Compatibility alias for `username`. New integrations should use `username`.
          deprecated: true
        password:
          type: string
          description: Partner password.
          format: password
    LoginResult:
      type: object
      properties:
        token:
          type: string
          description: 'Signed client JWT. Send it as `Authorization: Bearer <token>`; treat it as opaque.'
        username:
          type: string
          description: Authenticated client username.
    LoginResponse:
      description: Login response. Returned with `code = 1`.
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required:
            - body
          properties:
            code:
              type: integer
              enum:
                - 1
            body:
              $ref: '#/components/schemas/LoginResult'
    PlaceCouponRequest:
      type: object
      description: See [Coupon Placement](https://sportapi.net/docs/coupon/bet-placement/place-coupon.html).
      required:
        - list_bets
        - amount
      properties:
        list_bets:
          type: array
          minItems: 1
          description: 'Bet pointers of the selected outcomes, one string per bet. Format: `line_type#game_id#group_id#type_id#rate#coefficient[#player_id]`
            (`#`, `|` or the mixed format are accepted). Build it from the Sport Line outcome without
            modifying it. One accumulator may contain no more than 15 events. See [Bet Pointer](https://sportapi.net/docs/coupon/bet-placement/bet-pointer.html).'
          items:
            type: string
            example: line#737779544#1#1#0#1.85
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Positive stake of **one** coupon. With `multi = true` it applies to every single
            created, so the total debit is `amount × number of entries in list_bets`.
          example: 10
        currency:
          type: string
          nullable: true
          description: Any currency identifier (`USD`, `UAH`, `COIN`, an internal currency…). Not returned
            in coupon models — store it on your side.
          example: USD
        callback_url:
          type: string
          nullable: true
          description: Result handler URL for callbacks (`https://` in production). `null`, an empty string
            or an omitted field disables callbacks for this coupon; without callbacks the main site domain
            may be given.
          example: https://partner.example.com/api/coupon-result
        lang:
          type: string
          nullable: true
          description: Two-letter language code for names in coupon data. Fixed at placement time; ask
            the manager for the list of codes.
          example: en
        mode:
          type: string
          enum:
            - reject
            - accept
          default: reject
          description: 'Changed-odds rule: `reject` — reject the coupon if odds changed (default, also
            used when the field is omitted or `null`); `accept` — accept changes allowed by `mode_type`.
            See [Odds Changes](https://sportapi.net/docs/coupon/bet-placement/odds-changes.html).'
        mode_type:
          type: integer
          enum:
            - 1
            - 2
            - 3
          description: 'Required when `mode = "accept"`: `1` — accept increases only, `2` — accept decreases
            only, `3` — accept both. Never allows blocked or unavailable outcomes. Omit it (or send `null`)
            with `mode = "reject"`.'
        multi:
          type: boolean
          nullable: true
          default: false
          description: '`false` (default) — all entries form one single or accumulator; `true` — a separate
            single for every entry. See [Singles, Accumulators and multi](https://sportapi.net/docs/coupon/bet-placement/coupon-types.html).'
    OutcomeChange:
      type: object
      description: A bet that failed validation during placement (`body.changes[]`).
      properties:
        game_id:
          type: integer
          format: int64
          description: Event ID from the submitted pointer.
        bet_coefficient:
          type: number
          description: Odds submitted by the partner.
        actual_coefficient:
          type: number
          nullable: true
          description: Current odds, or `null` when the outcome is unavailable or validation did not complete.
        change_type:
          type: integer
          nullable: true
          description: '`1` — odds increased, `2` — odds decreased, `null` — not applicable (blocked,
            unavailable or validation error).'
        status:
          type: string
          description: '`rejected` (501, odds changed), `no_data` (502, outcome absent), `block` (503,
            outcome blocked), `error` (504, validation error).'
          enum:
            - rejected
            - no_data
            - block
            - error
    CouponBet:
      type: object
      description: One accepted bet inside a coupon (`events_data[]`). Identify it locally by `coupon_code`
        + `id`. See [Coupon and Bet Model](https://sportapi.net/docs/coupon/coupons/coupon-model.html).
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Internal accepted-bet ID. In callbacks the same ID arrives as the string `uuid`.
        game_id:
          type: integer
          format: int64
          description: ID of the event or sub-event the bet was placed on.
        main_game_id:
          type: integer
          format: int64
          nullable: true
          description: Main game ID from the provider data.
        is_sub_game:
          type: boolean
          description: '`true` when the bet belongs to a sub-event or period.'
        parent_game_id:
          type: integer
          format: int64
          nullable: true
          description: Parent event ID for a sub-event.
        sub_game_key:
          type: string
          nullable: true
          description: Stable internal sub-event key.
        sgame_id:
          type: string
          nullable: true
          description: Sub-event ID from the sports line provider.
        game_num:
          type: integer
          format: int64
          nullable: true
          description: Additional provider game number.
        stat_id:
          type: string
          nullable: true
          description: Provider statistics ID.
        dop_name:
          type: string
          nullable: true
          description: Name of the period, half, set, inning or another sub-event.
        raw_pointer:
          type: string
          description: Original bet pointer used at placement, stored unmodified.
        line_type:
          type: string
          description: '`line` for Prematch, `live` for Live.'
          enum:
            - line
            - live
        is_live:
          type: boolean
          description: '`true` when the bet was created from the Live line.'
        sport_id:
          type: integer
          format: int64
          nullable: true
          description: Sport ID.
        sport_name:
          type: string
          nullable: true
          description: Localized sport name.
        tournament_id:
          type: integer
          format: int64
          nullable: true
          description: Tournament ID.
        tournament:
          type: string
          nullable: true
          description: Localized tournament name.
        event_date:
          type: integer
          format: int64
          nullable: true
          description: Scheduled event start. Unix timestamp in milliseconds.
        opp1:
          type: string
          nullable: true
          description: First team or participant.
        opp2:
          type: string
          nullable: true
          description: Second team or participant.
        team1_id:
          type: integer
          format: int64
          nullable: true
          description: First team or participant ID.
        team2_id:
          type: integer
          format: int64
          nullable: true
          description: Second team or participant ID.
        opp_icon1:
          type: integer
          format: int64
          nullable: true
          description: Legacy-compatible name; equals `team1_id` (an ID, not an image). Use `team1_id`.
        opp_icon2:
          type: integer
          format: int64
          nullable: true
          description: Legacy-compatible name; equals `team2_id` (an ID, not an image). Use `team2_id`.
        bet_group_id:
          type: integer
          format: int64
          description: Bet group (market) ID.
        bet_group_name:
          type: string
          nullable: true
          description: Localized bet group name.
        bet_id:
          type: integer
          format: int64
          description: Outcome ID within the group.
        bet_name:
          type: string
          nullable: true
          description: Localized outcome name; may already include the parameter and player name.
        rate:
          type: string
          description: 'Outcome parameter: total, handicap, or `0` when no parameter is required.'
          example: '0'
        status:
          type: integer
          description: |-
            Bet status (a different table from coupon statuses):

            | Code | Name | Settlement multiplier |
            |---|---|---|
            | `0` | `NET` — not settled yet | — |
            | `1` | `WIN` | original `coef` |
            | `2` | `LOSE` | `0` |
            | `3` | `RETURN` | `1` |
            | `4` | `RECALCULATE` — returned for recalculation | — |
            | `21` | `HALF_WIN` | `(coef + 1) / 2` |
            | `22` | `HALF_LOSE` | `0.5` |
            | `23` | `PUSH` | `1` |
        coef:
          type: number
          description: Bet odds fixed at placement.
        calc_coef:
          type: number
          nullable: true
          description: Bet settlement multiplier; `null` before settlement.
        calculate_date:
          type: integer
          format: int64
          nullable: true
          description: Bet settlement time; `null` before settlement. Unix timestamp in milliseconds.
        settlement_reason_code:
          type: string
          nullable: true
          description: Stable machine-readable settlement or return reason, for example `AUTOMATIC_SETTLEMENT`,
            `MATCH_CANCELLED`, `MATCH_POSTPONED`, `MARKET_PUSH`, `REMOTE_WIN`. The list may grow — store
            unknown values without rejecting the response. `null` before settlement.
        settlement_reason:
          type: string
          nullable: true
          description: Settlement or return reason text. Not a program key; may be untranslated.
        bet_score:
          type: string
          description: Legacy compatibility field containing the original bet pointer — **not** the match
            score.
        calculate_score:
          type: string
          nullable: true
          description: Final full score used for settlement.
        placement_score_full:
          type: string
          nullable: true
          description: Full score when the bet was placed.
        placement_score_periods:
          type: string
          nullable: true
          description: Period-by-period score when the bet was placed.
        calculation_score_full:
          type: string
          nullable: true
          description: Full score at settlement time.
        calculation_score_periods:
          type: string
          nullable: true
          description: Period-by-period score at settlement time.
        timer:
          type: integer
          nullable: true
          description: Event timer, when available.
    Coupon:
      type: object
      description: Full coupon model. Use `real_win` for crediting after a final status; never `potential_win`.
        See [Coupon and Bet Model](https://sportapi.net/docs/coupon/coupons/coupon-model.html).
      properties:
        coupon_code:
          type: string
          description: Public coupon code, usually 12 digits. Store and send it as a string — leading
            zeros are part of the code.
          example: '000000000272'
        date:
          type: integer
          format: int64
          description: Coupon placement time. Unix timestamp in milliseconds.
        status:
          type: integer
          description: |-
            Coupon status (a different table from bet statuses):

            | Code | Name | Meaning | Final |
            |---|---|---|---|
            | `0` | `NEW` | Active, or an accumulator is partially settled | No |
            | `2` | `WIN` | The coupon won | Yes |
            | `4` | `LOSE` | The coupon lost (for an accumulator — possibly right after the first losing bet) | Yes |
            | `8` | `RETURN` | The coupon was fully returned | Yes |
            | `15` | `UPDATE` | Returned for recalculation, waiting for a new result | No |

            See [Statuses and Payouts](https://sportapi.net/docs/coupon/settlement/statuses-and-payouts.html).
        coupon_type:
          type: integer
          description: '`1` — single, `2` — accumulator.'
        events_count:
          type: integer
          description: Number of bets. Always iterate over the actual `events_data`.
        events_data:
          type: array
          description: All bets of the coupon.
          items:
            $ref: '#/components/schemas/CouponBet'
        has_return:
          type: boolean
          description: '`true` when the coupon contains a returned bet.'
        asian:
          type: boolean
          description: '`true` when the coupon contains an Asian market.'
        amount:
          type: number
          description: Stake amount.
        win:
          type: number
          description: Current displayed payout, kept for display and compatibility.
        potential_win:
          type: number
          description: Potential payout calculated at placement.
        real_win:
          type: number
          nullable: true
          description: Actual payout after settlement; `null` before a final result.
        coef:
          type: number
          description: 'Working odds: original before settlement, may account for returns after settlement.'
        original_coef:
          type: number
          description: Coupon odds fixed at placement.
        calculate_coef:
          type: number
          nullable: true
          description: Final settlement multiplier; `null` before settlement.
        calculate_date:
          type: integer
          format: int64
          nullable: true
          description: Time of the latest settled bet; `null` before settlement (never `0`). Unix timestamp
            in milliseconds.
    PlaceCouponResult:
      type: object
      description: '`coupons` holds the created coupons on success (always an array — with `multi = true`
        one object per single). On errors `501`–`504`, `changes` lists the bets that failed validation.'
      properties:
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/Coupon'
        changes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/OutcomeChange'
    PlaceCouponResponse:
      description: Coupon placement response. Returned with `code = 1`.
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required:
            - body
          properties:
            code:
              type: integer
              enum:
                - 1
            body:
              $ref: '#/components/schemas/PlaceCouponResult'
    GetCouponResponse:
      description: One coupon directly in `body` (there is no `body.coupons` array here). Returned with
        `code = 1`.
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required:
            - body
          properties:
            code:
              type: integer
              enum:
                - 1
            body:
              $ref: '#/components/schemas/Coupon'
    CouponResultsByIds:
      type: object
      title: By coupon codes
      description: 'Mode 1: current state of known coupons. Do not combine with dates.'
      required:
        - coupon_ids
      properties:
        coupon_ids:
          type: array
          minItems: 1
          maxItems: 100
          description: Coupon codes as strings (no more than 100 per request).
          items:
            type: string
            example: '000000000272'
    CouponResultsByPeriod:
      type: object
      title: By placement period
      description: 'Mode 2: coupons **placed** in the period (not settled). `end_date` must be greater
        than `start_date`; the interval cannot exceed 24 hours.'
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: integer
          format: int64
          description: Start of the placement period. Unix timestamp in milliseconds.
          example: 1784880000000
        end_date:
          type: integer
          format: int64
          description: End of the placement period. Unix timestamp in milliseconds.
          example: 1784966400000
    CouponResultsRequest:
      description: Exactly one mode per request. An invalid combination returns business error `1002`.
      oneOf:
        - $ref: '#/components/schemas/CouponResultsByIds'
        - $ref: '#/components/schemas/CouponResultsByPeriod'
    CouponResultsResult:
      type: object
      properties:
        query_type:
          type: string
          description: 'Processed mode: `ids` or `time`. Set by the API.'
          enum:
            - ids
            - time
        coupons:
          type: array
          description: Current full coupon models. Unknown codes and other partners' coupons are omitted;
            the order may differ from the request — match by `coupon_code`.
          items:
            $ref: '#/components/schemas/Coupon'
    CouponResultsResponse:
      description: Batch coupon query response. Returned with `code = 1`.
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required:
            - body
          properties:
            code:
              type: integer
              enum:
                - 1
            body:
              $ref: '#/components/schemas/CouponResultsResult'
    CouponListResponse:
      description: Coupons directly in `body[]`. An empty array is a successful result. Returned with
        `code = 1`.
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required:
            - body
          properties:
            code:
              type: integer
              enum:
                - 1
            body:
              type: array
              items:
                $ref: '#/components/schemas/Coupon'
    BalanceResult:
      type: object
      properties:
        balance:
          type: number
          description: Balance of the authenticated client account in the Coupon Settlement System (not
            an end-user balance). Coupon placement debits it automatically.
    BalanceResponse:
      description: Client balance response. Returned with `code = 1`.
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required:
            - body
          properties:
            code:
              type: integer
              enum:
                - 1
            body:
              $ref: '#/components/schemas/BalanceResult'
    CallbackBet:
      type: object
      description: Settlement snapshot of one bet in a callback.
      properties:
        uuid:
          type: string
          description: The bet ID as a string; equals `events_data[].id` of the full model.
          example: '912'
        status:
          type: integer
          description: Current bet status (see `CouponBet.status`).
        calculate_coefficient:
          type: number
          nullable: true
          description: Bet settlement multiplier (`calc_coef` in the full model).
        calculate_date:
          type: integer
          format: int64
          nullable: true
          description: Bet settlement date. Unix timestamp in milliseconds.
        calculate_score:
          type: string
          description: Settlement score; may be an empty string for an active bet.
        settlement_reason_code:
          type: string
          nullable: true
          description: Stable machine-readable settlement or return reason, for example `AUTOMATIC_SETTLEMENT`,
            `MATCH_CANCELLED`, `MATCH_POSTPONED`, `MARKET_PUSH`, `REMOTE_WIN`. The list may grow — store
            unknown values without rejecting the response. `null` before settlement.
        settlement_reason:
          type: string
          nullable: true
          description: Settlement or return reason text; `null` before settlement.
        timer:
          type: integer
          description: Compatibility field, currently `0`.
    CallbackCoupon:
      type: object
      description: Settlement snapshot of one coupon. It does not include `amount`, currency, names or
        the original pointer — store them at placement or read the full model through the API.
      properties:
        coupon_code:
          type: string
          description: Public coupon code.
        realWin:
          type: number
          description: Actual payout. `0` in an intermediate snapshot.
        calculate_coefficient:
          type: number
          description: Final settlement multiplier. `0` in an intermediate snapshot.
        status:
          type: integer
          description: Current coupon status (see `Coupon.status`).
        calculate_date:
          type: integer
          format: int64
          nullable: true
          description: Latest settlement date among the settled bets. Unix timestamp in milliseconds.
        events_data:
          type: array
          description: All bets, including unsettled ones.
          items:
            $ref: '#/components/schemas/CallbackBet'
    CallbackPayload:
      type: object
      description: Body of a result callback. Not wrapped in the Client API envelope. Verify `X-Coupon-Signature`
        on the raw bytes **before** parsing, deduplicate by `batchId`, and process every coupon.
      required:
        - event
        - batchId
        - couponCount
        - coupons
      properties:
        event:
          type: string
          description: Always `coupons.settled` — also for intermediate, recalculation and post-recalculation
            snapshots; check the statuses.
          enum:
            - coupons.settled
        batchId:
          type: string
          description: ID of this batch version. A repeated delivery keeps the same `batchId`; a new settlement
            state gets a new one. Store it with a unique constraint.
        clientId:
          type: integer
          description: Internal partner account ID. Informational only.
        couponCount:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of entries in `coupons`.
        coupons:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CallbackCoupon'
    CallbackAck:
      type: object
      description: 'Optional acknowledgement body. HTTP 200 with an empty body is also a success. `success:
        false` or `processed < couponCount` is a final error that is **not** retried.'
      properties:
        success:
          type: boolean
        processed:
          type: integer
          description: Must equal `couponCount`.
