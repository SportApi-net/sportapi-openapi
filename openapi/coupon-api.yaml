      summary: Coupons settled in the last N minutes
      description: |-
        Returns full models of coupons whose **final settlement time** falls within the last `time` minutes (placement time does not matter). Active coupons are not returned.

        For polling, request a window at least twice the polling interval — for example every 5 minutes with `time=10`. Receiving an already processed coupon again is expected: update by `coupon_code` and keep financial operations idempotent. See [Polling Fallback](https://sportapi.net/docs/coupon/settlement/polling-fallback.html).
