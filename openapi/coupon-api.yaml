# SportAPI Coupon API (bet placement and settlement) — OpenAPI 3.0.3 description.
# Written from the public documentation: https://sportapi.net/docs/coupon/getting-started/overview.html
# This file is MIT-licensed. Access to the API itself requires a SportAPI subscription: https://sportapi.net
openapi: 3.0.3
info:
  title: SportAPI Coupon API
  version: 0.1.0
  description: |
    OpenAPI 3.0 description of the **SportAPI Coupon API** (bet placement and settlement): submit bets selected
    in your sportsbook to the SportAPI Coupon Settlement System, receive confirmation, and get settlement
    results by polling or by signed callbacks.

    Written from the public [SportAPI documentation](https://sportapi.net/docs/coupon/getting-started/overview.html). It covers the
    recommended `/api/partner/**` methods and the result callback. Legacy routes (`/api/v2/login`,
    `/bet/place`, `/coupons/*`, `/api/v3/partner/bet/*`) and the experimental cashout are intentionally left
    out — see [Compatible Legacy Routes](https://sportapi.net/docs/coupon/reference/legacy-api.html) and [Cashout](https://sportapi.net/docs/coupon/coupons/cashout.html).

    ## Flow

    ```text
    POST /api/partner/login          → client JWT
    POST /api/partner/coupons/place  → coupons (store coupon_code as a string)
    callback or polling              → settlement result (use real_win)
    ```

    Bet pointers come from the [Sport Line API](https://sportapi.net/docs/sport-line/data-models/odds.html) selection you show to the
    user — see [Bet Pointer](https://sportapi.net/docs/coupon/bet-placement/bet-pointer.html).

    ## Access

    The manager provides the base URL (set it as the `baseUrl` server variable), a username and a password,
    and — if callbacks are enabled — a `callback_secret`. The placeholder `https://coupon-api.example.com`
    is only an example. Keep credentials, the JWT and the secret on the server side.

    ## Checking the result

    | HTTP | `code` | Meaning |
    |---|---|---|
    | 2xx | `1` | Success — parse `body` according to the method |
    | 2xx | `0` | Business error — handle `error_code` (and `body.changes` for `501`–`504`) |
    | 400 | — | Invalid JSON or parameter type |
    | 401 | — | JWT missing, invalid, expired or revoked — sign in again |
    | 403 | — | Token lacks the client role or access is denied |
    | 5xx | — | Server error — never retry coupon placement blindly |

    All dates are Unix timestamps in **milliseconds**. Amounts, odds and payouts are decimal numbers without a
    fixed number of decimal places — use a decimal type for money. See
    [Common Conventions](https://sportapi.net/docs/coupon/getting-started/common-conventions.html) and [Error Codes](https://sportapi.net/docs/coupon/reference/error-codes.html).

    ## Get access

    The data API is a commercial service: plans start from $30/month, with a free 2-day trial.
    Contact the [SportAPI manager on Telegram](https://t.me/sportapinet_bot?start=github_sportapi_openapi) or visit [sportapi.net](https://sportapi.net/sport-events-api.html).
  contact:
    name: SportAPI
    url: https://sportapi.net
  license:
    name: MIT (this specification document)
    url: https://opensource.org/licenses/MIT
externalDocs:
  description: SportAPI documentation — Coupon API Quick Integration
  url: https://sportapi.net/docs/coupon/quick-integration.html
servers:
  - url: '{baseUrl}'
    description: Client API base URL issued by the SportAPI manager (test or production).
    variables:
      baseUrl:
        default: https://coupon-api.example.com
        description: Your Coupon API base URL, without a trailing slash. The default is the documentation
          placeholder.
security:
  - ClientJWT: []
tags:
  - name: Service
    description: Availability check and authentication.
  - name: Bet placement
    description: Coupon placement and the settlement callback.
    externalDocs:
      description: Coupon Placement
      url: https://sportapi.net/docs/coupon/bet-placement/place-coupon.html
  - name: Coupons
    description: Reading coupons and settlement results.
    externalDocs:
      description: Coupon and Bet Model
      url: https://sportapi.net/docs/coupon/coupons/coupon-model.html
  - name: Account
    description: The client account balance in the Coupon Settlement System.
paths:
  /api/partner/health:
    get:
      tags:
        - Service
      summary: Check API availability
      description: Checks HTTP availability of the API. It does not confirm that credentials, a JWT or
        any coupon data are valid. No authorization required.
      operationId: getHealth
      security: []
      externalDocs:
        description: Endpoint Reference
        url: https://sportapi.net/docs/coupon/reference/endpoints.html
      responses:
        '200':
          description: The API is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  summary: Available
                  value:
                    code: 1
                    body: ok
                    error_code: null
                    error_message: null
                    date: 1784970000000
                    time_ms: 1
                    path: /api/partner/health
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/partner/login:
    post:
      tags:
        - Service
      summary: Obtain a client JWT
      description: |-
        Exchanges the partner username and password for a client JWT. Reuse the token until the API returns HTTP 401; there is no refresh method.

        Login business errors are returned with HTTP 200 and `code = 0`:

        | `error_code` | `error_message` | Meaning |
        |---|---|---|
        | `1002` | `Not all params` | Username or password not provided |
        | `1003` | `Wrong login or password` | Unknown username or wrong password (not distinguished) |
        | `1004` | `Client account is disabled` | Contact the manager |
        | `1006` | `Client access has expired` | Contact the manager |
        | `1007` | `Insufficient balance` | The client balance is zero or negative |

        Keep credentials and the JWT on the server side only.
      operationId: login
      security: []
      externalDocs:
        description: Authentication
        url: https://sportapi.net/docs/coupon/getting-started/authentication.html
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                summary: Username and password
                value:
                  username: partner-demo
                  password: strong-password
      responses:
        '200':
          description: Token issued (`code = 1`) or a login business error (`code = 0`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/BusinessError'
              examples:
                success:
                  summary: Token issued
                  value:
                    code: 1
                    body:
                      token: eyJhbGciOiJIUzI1NiJ9...
                      username: partner-demo
                    error_code: null
                    error_message: null
                    date: 1784970000000
                    time_ms: 35
                    path: /api/partner/login
                wrongCredentials:
                  summary: Wrong login or password
                  value:
                    code: 0
                    body: null
                    error_code: 1003
                    error_message: Wrong login or password
                    date: 1784970000000
                    time_ms: 5
                    path: /api/partner/login
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/partner/coupons/place:
    post:
      tags:
        - Bet placement
      summary: Place a coupon (single, accumulator or several singles)
      description: |-
        Validates every bet pointer against the current sports line and atomically creates one or more coupons, debiting the SportAPI client balance (not the end user's balance).

        - `multi = false` (default): all pointers form one single or accumulator; one `amount` is debited.
        - `multi = true`: one single per pointer; `amount × number of pointers` is debited.
        - Insufficient balance returns `507`: no coupon is created and the balance is unchanged.

        A coupon is accepted **only** when `code = 1`: store `body.coupons[]` (always an array) and keep `coupon_code` as a string. Until then the bet slip is only the user's preliminary selection.

        | `error_code` | Cause |
        |---|---|
        | `10` | Request body not provided |
        | `11` | Invalid bet pointer format |
        | `12` | `amount` missing or not positive |
        | `501` | Odds changed and the mode does not allow it (`body.changes`) |
        | `502` | Outcome absent from the current line (`body.changes`) |
        | `503` | Outcome blocked (`body.changes`) |
        | `504` | Outcome validation error (`body.changes`) |
        | `506` | Accumulator combines bets from the same match or its sub-events |
        | `507` | Insufficient client balance for all coupons |
        | `1002` | Invalid parameter set |
        | `10000` | Internal service error |

        Business codes `502`–`504` are not HTTP statuses. **Never retry this request blindly** after a network or server error — first make sure the original request was not processed, or a duplicate coupon may be created.

        If callbacks are enabled for the account and `callback_url` is set, settlement snapshots are sent to that URL (see the `couponsSettled` callback).
      operationId: placeCoupon
      externalDocs:
        description: Coupon Placement
        url: https://sportapi.net/docs/coupon/bet-placement/place-coupon.html
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceCouponRequest'
            examples:
              single:
                summary: Single with safe defaults
                value:
                  list_bets:
                    - line#737779544#1#1#0#1.85
                  amount: 10
                  currency: USD
                  callback_url: https://partner.example.com/api/coupon-result
                  lang: en
                  mode: reject
                  multi: false
              accumulator:
                summary: Accumulator of two bets
                value:
                  list_bets:
                    - line#737779544#1#1#0#1.85
                    - line#737880112#8#6#2.5#1.64
                  amount: 10
                  currency: USD
                  multi: false
              multiSingles:
                summary: Two separate singles (multi = true, total debit 20)
                value:
                  list_bets:
                    - line#737779544#1#1#0#1.85
                    - line#737880112#8#6#2.5#1.64
                  amount: 10
                  multi: true
              acceptHigherOdds:
                summary: Accept odds increases only
                value:
                  list_bets:
                    - live#738917381#119#5869#0.5#3.6#149439538
                  amount: 10
                  mode: accept
                  mode_type: 1
      responses:
        '200':
          description: Coupons created (`code = 1`) or a business error (`code = 0`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlaceCouponResponse'
                  - $ref: '#/components/schemas/BusinessError'
              examples:
                single:
                  summary: Single created
                  value:
                    code: 1
                    body:
                      coupons:
                        - coupon_code: '000000000272'
                          amount: 10
                          win: 18.5
                          potential_win: 18.5
                          real_win: null
                          coef: 1.85
                          original_coef: 1.85
                          calculate_coef: null
                          has_return: false
                          date: 1784970000000
                          status: 0
                          asian: false
                          calculate_date: null
                          coupon_type: 1
                          events_count: 1
                          events_data:
                            - id: 84521
                              game_id: 737779544
                              main_game_id: 737779544
                              is_sub_game: false
                              parent_game_id: null
                              sub_game_key: null
                              raw_pointer: line#737779544#1#1#0#1.85
                              line_type: line
                              is_live: false
                              bet_group_id: 1
                              bet_group_name: Match Result
                              bet_id: 1
                              bet_name: First Team to Win
                              sport_id: 1
                              sport_name: Football
                              tournament_id: 10001
                              tournament: National League
                              event_date: 1784971800000
                              status: 0
                              opp1: Team A
                              opp2: Team B
                              coef: 1.85
                              calc_coef: null
                              bet_score: line#737779544#1#1#0#1.85
                              calculate_date: null
                              calculate_score: null
                              settlement_reason_code: null
                              settlement_reason: null
                              placement_score_full: null
                              placement_score_periods: null
                              calculation_score_full: null
                              calculation_score_periods: null
                              timer: null
                              dop_name: null
                              rate: '0'
                              sgame_id: null
                              game_num: null
                              stat_id: null
                              team1_id: 101
                              team2_id: 102
                              opp_icon1: 101
                              opp_icon2: 102
                    error_code: null
                    error_message: null
                    date: 1784970000015
                    time_ms: 45
                    path: /api/partner/coupons/place
                oddsDecreased:
                  summary: 501 — odds decreased
                  value:
                    code: 0
                    body:
                      changes:
                        - game_id: 737779544
                          bet_coefficient: 2.19
                          actual_coefficient: 2.09
                          change_type: 2
                          status: rejected
                    error_code: 501
                    error_message: Coefficient is change
                    date: 1784970000000
                    time_ms: 20
                    path: /api/partner/coupons/place
                oddsIncreased:
                  summary: 501 — odds increased
                  value:
                    code: 0
                    body:
                      changes:
                        - game_id: 737779544
                          bet_coefficient: 2.19
                          actual_coefficient: 2.39
                          change_type: 1
                          status: rejected
                    error_code: 501
                    error_message: Coefficient is change
                    date: 1784970000000
                    time_ms: 20
                    path: /api/partner/coupons/place
                outcomeUnavailable:
                  summary: 502 — outcome not available
                  value:
                    code: 0
                    body:
                      changes:
                        - game_id: 737779544
                          bet_coefficient: 2.19
                          actual_coefficient: null
                          change_type: null
                          status: no_data
                    error_code: 502
                    error_message: Bet outcome is not available
                    date: 1784970000000
                    time_ms: 20
                    path: /api/partner/coupons/place
                outcomeBlocked:
                  summary: 503 — outcome blocked
                  value:
                    code: 0
                    body:
                      changes:
                        - game_id: 737779544
                          bet_coefficient: 2.19
                          actual_coefficient: null
                          change_type: null
                          status: block
                    error_code: 503
                    error_message: Bet outcome is blocked
                    date: 1784970000000
                    time_ms: 20
                    path: /api/partner/coupons/place
                insufficientBalance:
                  summary: 507 — insufficient balance
                  value:
                    code: 0
                    error_code: 507
                    error_message: Insufficient balance
                    date: 1753000000000
                    time_ms: 5
                    path: /api/partner/coupons/place
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
      callbacks:
        couponsSettled:
          '{$request.body#/callback_url}':
            post:
              summary: Settlement snapshot sent to the partner
              description: |-
                Sent by the SportAPI Coupon Settlement System to the partner's `callback_url` after a settlement change — final settlement of a single, every newly settled bet of an accumulator, the first losing bet, the final accumulator state, a return for recalculation and the new result after it. One request carries up to 100 coupon snapshots for one account and one `callback_url`.

                Callbacks are optional: the manager enables them and issues a `callback_secret`.

                **Signature.** `X-Coupon-Signature: sha256=<lowercase hex HMAC-SHA256(callback_secret, raw body)>`. Verify it on the exact request bytes before parsing, using a constant-time comparison. No JWT is sent.

                **Delivery.** Only HTTP 200 is a successful acknowledgement (201/202/204 are not). Timeouts, transport errors and HTTP 500/502/503/504 are retried: immediately, then after 1, 5, 15 and 60 minutes — at most five attempts. The whole request has 10 seconds. HTTP 401 (bad signature), 403 (IP filter) and any other status are final.

                See [Result Callbacks](https://sportapi.net/docs/coupon/settlement/callbacks.html), [Callback Signature](https://sportapi.net/docs/coupon/settlement/callback-signature.html) and [Retries and Idempotency](https://sportapi.net/docs/coupon/settlement/retries-and-idempotency.html).
              operationId: couponsSettledCallback
              security: []
              parameters:
                - name: X-Coupon-Signature
                  in: header
                  required: true
                  description: '`sha256=` followed by the lowercase hexadecimal HMAC-SHA256 of the raw
                    body.'
                  schema:
                    type: string
                    pattern: ^sha256=[0-9a-f]+$
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/CallbackPayload'
                    examples:
                      intermediateAccumulator:
                        summary: Intermediate accumulator snapshot
                        description: Example from the documentation.
                        value:
                          event: coupons.settled
                          batchId: d407e986f3a64d9d36a77bf532322ef8
                          clientId: 17
                          couponCount: 1
                          coupons:
                            - coupon_code: '000000000272'
                              realWin: 0
                              calculate_coefficient: 0
                              status: 0
                              calculate_date: 1784897500000
                              events_data:
                                - uuid: '912'
                                  status: 1
                                  calculate_coefficient: 2
                                  calculate_date: 1784897500000
                                  calculate_score: '2:1'
                                  settlement_reason_code: REMOTE_WIN
                                  settlement_reason: Win
                                  timer: 0
                                - uuid: '913'
                                  status: 0
                                  calculate_coefficient: null
                                  calculate_date: null
                                  calculate_score: ''
                                  settlement_reason_code: null
                                  settlement_reason: null
                                  timer: 0
              responses:
                '200':
                  description: Batch committed. The body may be empty or a `CallbackAck`.
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/CallbackAck'
                      examples:
                        ack:
                          summary: Recommended acknowledgement
                          value:
                            success: true
                            processed: 1
                '401':
                  description: Invalid or missing signature. Final — not retried.
                '403':
                  description: Rejected by the partner's IP filter. Final — not retried.
                '500':
                  description: Temporary error — delivery is retried.
                '502':
                  description: Temporary error — delivery is retried.
                '503':
                  description: Temporary error — delivery is retried.
                '504':
                  description: Temporary error — delivery is retried.
  /api/partner/coupons/get:
    get:
      tags:
        - Coupons
      summary: Get one coupon
      description: |-
        Returns the current state of one coupon with all its bets, directly in `body`. A coupon that does not exist and a coupon of another partner both return business error `471` (`Coupon not found`).

        The endpoint also recognizes the compatibility parameter names `code`, `coupon_id` and `bet_code`; new integrations should use `coupon_code` and send only one of them.
      operationId: getCoupon
      externalDocs:
        description: Retrieving a Single Coupon
        url: https://sportapi.net/docs/coupon/coupons/get-coupon.html
      parameters:
        - name: coupon_code
          in: query
          required: true
          description: Public coupon code as a string, including leading zeros.
          schema:
            type: string
          example: '000000000272'
      responses:
        '200':
          description: The coupon (`code = 1`) or a business error (`code = 0`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GetCouponResponse'
                  - $ref: '#/components/schemas/BusinessError'
              examples:
                won:
                  summary: Settled winning single
                  value:
                    code: 1
                    body:
                      coupon_code: '000000000272'
                      amount: 10
                      win: 18.5
                      potential_win: 18.5
                      real_win: 18.5
                      coef: 1.85
                      original_coef: 1.85
                      calculate_coef: 1.85
                      has_return: false
                      date: 1784970000000
                      status: 2
                      asian: false
                      calculate_date: 1784973600000
                      coupon_type: 1
                      events_count: 1
                      events_data:
                        - id: 84521
                          game_id: 737779544
                          main_game_id: 737779544
                          is_sub_game: false
                          parent_game_id: null
                          sub_game_key: null
                          raw_pointer: line#737779544#1#1#0#1.85
                          line_type: line
                          is_live: false
                          bet_group_id: 1
                          bet_group_name: Match Result
                          bet_id: 1
                          bet_name: First Team to Win
                          sport_id: 1
                          sport_name: Football
                          tournament_id: 10001
                          tournament: National League
                          event_date: 1784971800000
                          status: 1
                          opp1: Team A
                          opp2: Team B
                          coef: 1.85
                          calc_coef: 1.85
                          bet_score: line#737779544#1#1#0#1.85
                          calculate_date: 1784973600000
                          calculate_score: '2:1'
                          settlement_reason_code: AUTOMATIC_SETTLEMENT
                          settlement_reason: Calculated automatically
                          placement_score_full: null
                          placement_score_periods: null
                          calculation_score_full: '2:1'
                          calculation_score_periods: null
                          timer: null
                          dop_name: null
                          rate: '0'
                          sgame_id: null
                          game_num: null
                          stat_id: null
                          team1_id: 101
                          team2_id: 102
                          opp_icon1: 101
                          opp_icon2: 102
                    error_code: null
                    error_message: null
                    date: 1784973600100
                    time_ms: 6
                    path: /api/partner/coupons/get
                notFound:
                  summary: 471 — coupon not found
                  value:
                    code: 0
                    body: null
                    error_code: 471
                    error_message: Coupon not found
                    date: 1784970000000
                    time_ms: 5
                    path: /api/partner/coupons/get
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/partner/coupons/results:
    post:
      tags:
        - Coupons
      summary: Get coupons by codes or by placement period
      description: |-
        Two mutually exclusive modes:

        - **By codes** — `coupon_ids`, no more than 100 per request. Duplicates are removed, unknown and foreign coupons are omitted, the order may differ — match results by `coupon_code`.
        - **By placement period** — `start_date` and `end_date` in Unix milliseconds, at most 24 hours. Selection uses placement time, not settlement time; use `/coupons/calculated` for recent results.

        An invalid combination returns business error `1002`.
      operationId: getCouponResults
      externalDocs:
        description: Retrieving Coupons by List or Time Period
        url: https://sportapi.net/docs/coupon/coupons/query-results.html
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponResultsRequest'
            examples:
              byIds:
                summary: By coupon codes
                value:
                  coupon_ids:
                    - '000000000272'
                    - '000000000273'
              byPeriod:
                summary: By placement period (24 hours)
                value:
                  start_date: 1784880000000
                  end_date: 1784966400000
      responses:
        '200':
          description: Coupons found (`code = 1`, possibly an empty array) or a business error (`code
            = 0`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CouponResultsResponse'
                  - $ref: '#/components/schemas/BusinessError'
              examples:
                byIds:
                  summary: Result of an `ids` query
                  value:
                    code: 1
                    body:
                      query_type: ids
                      coupons:
                        - coupon_code: '000000000272'
                          amount: 10
                          win: 18.5
                          potential_win: 18.5
                          real_win: 18.5
                          coef: 1.85
                          original_coef: 1.85
                          calculate_coef: 1.85
                          has_return: false
                          date: 1784970000000
                          status: 2
                          asian: false
                          calculate_date: 1784973600000
                          coupon_type: 1
                          events_count: 1
                          events_data:
                            - id: 84521
                              game_id: 737779544
                              main_game_id: 737779544
                              is_sub_game: false
                              parent_game_id: null
                              sub_game_key: null
                              raw_pointer: line#737779544#1#1#0#1.85
                              line_type: line
                              is_live: false
                              bet_group_id: 1
                              bet_group_name: Match Result
                              bet_id: 1
                              bet_name: First Team to Win
                              sport_id: 1
                              sport_name: Football
                              tournament_id: 10001
                              tournament: National League
                              event_date: 1784971800000
                              status: 1
                              opp1: Team A
                              opp2: Team B
                              coef: 1.85
                              calc_coef: 1.85
